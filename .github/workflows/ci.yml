name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race spins up the Go race detector's concurrent goroutine
      # instrumentation, which is worth the extra runtime here since quirn
      # fans probes out concurrently against the target endpoint.
      - name: Test
        run: go test -race ./...

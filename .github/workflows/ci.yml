name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Formatting is a hard gate — an unformatted file fails the build.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race spins up the Go race detector's concurrent goroutine
      # instrumentation, which is worth the extra runtime here since quirn
      # fans probes out concurrently against the target endpoint.
      - name: Test
        run: go test -race ./...

      # A security tool should keep its own dependencies / stdlib clear of
      # known vulnerabilities. Scans the module and the Go version in use.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Asset naming (quirn_<goos>_<goarch>[.exe]) is a contract with
      # action.yml's prebuilt-binary download step — keep both in sync if
      # this changes.
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          name="quirn_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          mkdir -p dist
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "dist/${name}" .
          echo "artifact_name=${name}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/${{ env.artifact_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # keyless signing for build provenance
      attestations: write    # store the provenance attestation
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # download-artifact lays each named artifact out in its own
      # subdirectory; flatten so `gh release create` gets a flat file list.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -exec mv -t release {} +
          ls -la release

      # sha256 sums so users can verify a downloaded binary. The glob is
      # quirn_* so the checksums file never hashes itself.
      - name: Checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum quirn_* > checksums_sha256.txt
          cat checksums_sha256.txt

      # SLSA build provenance for every binary, keyless (Sigstore). Verify with:
      #   gh attestation verify quirn_<os>_<arch> --repo wroughtery/quirn
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release/quirn_*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

version: 2
updates:
  # Keep the pinned GitHub Actions (CI + release) current — the highest-value
  # ecosystem here, since the Go core is stdlib-only.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Go toolchain / any (rare) module bumps. Kept on so a stray dep never rots.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
